name: App Weekly Review

# Run the review only after App Scan has fully completed, including the signal-log
# commit. This removes the race between two independent cron schedules.
on:
  workflow_run:
    workflows: ["App Scan"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-weekly-review
  cancel-in-progress: false

jobs:
  review:
    # A failed scan must not produce a "fresh" review from stale signal data.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade git+https://github.com/rongardF/tvdatafeed.git

      - name: Build, publish and verify review
        env:
          MARKET: ${{ vars.MARKET || 'MYX' }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'yankhaing-cmyk/BursaMusangKing' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SEND_TELEGRAM: ${{ vars.SEND_TELEGRAM || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python export_review.py --publish
