name: App Weekly Review

on:
  schedule:
    # Was "30 10 * * 6" — Saturday only. The Weekly tab therefore froze for
    # six days at a time, and every signal from the preceding week was still
    # too young to score at that moment, so the horizon columns stayed blank.
    # 11:00 UTC = 19:00 MYT, ~100 min after the 09:20 UTC scan.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade git+https://github.com/rongardF/tvdatafeed.git

      - name: Build and publish review
        env:
          MARKET: ${{ vars.MARKET || 'MYX' }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'yankhaing-cmyk/BursaMusangKing' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SEND_TELEGRAM: ${{ vars.SEND_TELEGRAM || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python export_review.py --publish
