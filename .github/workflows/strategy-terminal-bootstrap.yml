name: Bootstrap Bursa ATR Strategy State
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: strategy-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: strategy-terminal/requirements.txt
      - run: pip install -r requirements.txt
      - run: python python/bootstrap_strategy_state.py
        env:
          WORKER_URL: ${{ secrets.STRATEGY_TERMINAL_WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.STRATEGY_TERMINAL_PUBLISH_TOKEN }}
          UPSTREAM_REPO: yankhaing-cmyk/BursaMusangKing
          UPSTREAM_REF: main
          MIN_UNIVERSE: '900'
          TRAIL_ATR_MULT: '3.0'
