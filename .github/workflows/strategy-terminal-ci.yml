name: Strategy Terminal CI
on:
  push:
    branches: [strategy-terminal-v1]
    paths:
      - 'strategy-terminal/**'
      - '.github/workflows/strategy-terminal-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: strategy-terminal/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check src/engine.js
          node --check public/app.js
          node --check public/sw.js
          python -m py_compile python/upstream.py python/publish_strategy_snapshot.py python/bootstrap_strategy_state.py
      - name: Unit and full-market state tests
        run: npm test
      - name: Validate D1 migration in SQLite
        run: |
          python - <<'PY'
          import sqlite3
          sql=open('migrations/0001_init.sql').read()
          db=sqlite3.connect(':memory:')
          db.executescript(sql)
          tables={r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          required={'strategy_snapshots','daily_runs','app_settings'}
          assert required <= tables, (required,tables)
          print('D1-compatible schema smoke test: PASS')
          PY
