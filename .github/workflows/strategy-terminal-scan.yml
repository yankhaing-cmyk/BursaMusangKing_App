name: Bursa ATR Strategy Scan
on:
  workflow_dispatch:
  # Enable schedule only after bootstrap + first live acceptance test succeeds:
  # schedule:
  #   - cron: '10 12 * * 1-5'
permissions:
  contents: read
concurrency:
  group: bursa-atr-strategy-terminal-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: strategy-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: strategy-terminal/requirements.txt
      - run: pip install -r requirements.txt
      - run: python python/publish_strategy_snapshot.py
        env:
          WORKER_URL: ${{ secrets.STRATEGY_TERMINAL_WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.STRATEGY_TERMINAL_PUBLISH_TOKEN }}
          UPSTREAM_REPO: yankhaing-cmyk/BursaMusangKing
          UPSTREAM_REF: main
          MIN_UNIVERSE: '900'
          TRAIL_ATR_MULT: '3.0'
